<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HAAK: ظل الفرعون</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#gameContainer {
  position: relative;
  box-shadow: 0 0 80px #00ffff, 0 0 160px #0066ff;
  border: 3px solid #00ffff;
  background: #000;
}
canvas {
  display: block;
  background: #0a0a1a;
  image-rendering: auto;
}
.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #00ffff;
  z-index: 10;
  padding: 20px;
}
.overlay h1 {
  font-size: 56px;
  text-shadow: 0 0 40px #00ffff, 0 0 80px #0066ff;
  margin-bottom: 20px;
  letter-spacing: 8px;
  text-align: center;
  font-weight: bold;
}
.overlay h2 {
  font-size: 28px;
  color: #ffaa00;
  margin-bottom: 25px;
  text-shadow: 0 0 20px #ffaa00;
  letter-spacing: 4px;
}
.overlay p {
  margin: 8px 0;
  font-size: 15px;
  text-align: center;
  line-height: 1.8;
  max-width: 600px;
  color: #aaddff;
}
.btn {
  margin-top: 25px;
  padding: 18px 50px;
  font-size: 20px;
  background: transparent;
  color: #00ffff;
  border: 3px solid #00ffff;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  letter-spacing: 4px;
  transition: all 0.3s;
  font-weight: bold;
}
.btn:hover, .btn:active {
  background: #00ffff;
  color: #000;
  box-shadow: 0 0 40px #00ffff;
}
#hud {
  position: absolute;
  top: 15px; left: 15px; right: 15px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 5;
  color: #00ffff;
  font-size: 14px;
  text-shadow: 0 0 10px #00ffff;
}
.bar-container {
  display: flex;
  align-items: center;
  margin: 4px 0;
}
.bar-label { width: 35px; font-weight: bold; font-size: 16px; }
.bar {
  width: 160px; height: 12px;
  background: rgba(0,0,0,0.7);
  border: 2px solid #00ffff;
  margin: 0 8px;
  overflow: hidden;
  border-radius: 6px;
}
.bar-fill { height: 100%; transition: width 0.2s; }
#hp-fill { background: linear-gradient(90deg, #ff0040, #ff6680); }
#en-fill { background: linear-gradient(90deg, #ffaa00, #ffdd44); }
#xp-fill { background: linear-gradient(90deg, #00ff88, #88ffcc); }
#location {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: #ffaa00;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 0 15px #ffaa00;
  letter-spacing: 3px;
  pointer-events: none;
  z-index: 5;
}
#score-display {
  position: absolute;
  top: 15px; right: 15px;
  color: #00ffff;
  font-size: 14px;
  text-shadow: 0 0 10px #00ffff;
  pointer-events: none;
  z-index: 5;
  text-align: right;
  font-weight: bold;
}
#mobileControls {
  position: absolute;
  bottom: 15px;
  left: 0;
  width: 100%;
  display: none;
  justify-content: space-between;
  padding: 0 15px;
  z-index: 5;
  pointer-events: none;
}
.ctrl-group { display: flex; gap: 8px; pointer-events: auto; }
.ctrl-btn {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 3px solid #00ffff;
  background: rgba(0, 255, 255, 0.15);
  color: #00ffff;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  font-weight: bold;
  box-shadow: 0 0 20px rgba(0,255,255,0.3);
}
.ctrl-btn:active, .ctrl-btn.active { background: rgba(0, 255, 255, 0.5); }
#jumpBtn { border-color: #ffaa00; color: #ffaa00; background: rgba(255, 170, 0, 0.15); }
#jumpBtn:active, #jumpBtn.active { background: rgba(255, 170, 0, 0.5); }
#attackBtn { border-color: #ff0040; color: #ff0040; background: rgba(255, 0, 64, 0.15); }
#attackBtn:active, #attackBtn.active { background: rgba(255, 0, 64, 0.5); }
#specialBtn { border-color: #00ff88; color: #00ff88; background: rgba(0, 255, 136, 0.15); font-size: 16px; }
#specialBtn:active, #specialBtn.active { background: rgba(0, 255, 136, 0.5); }
#dashBtn { border-color: #aa00ff; color: #aa00ff; background: rgba(170, 0, 255, 0.15); font-size: 16px; }
#dashBtn:active, #dashBtn.active { background: rgba(170, 0, 255, 0.5); }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game" width="960" height="540"></canvas>
  
  <div id="hud">
    <div>
      <div class="bar-container"><span class="bar-label">HP</span><div class="bar"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div><span id="hp-text">100</span></div>
      <div class="bar-container"><span class="bar-label">EN</span><div class="bar"><div class="bar-fill" id="en-fill" style="width:100%"></div></div><span id="en-text">100</span></div>
      <div class="bar-container"><span class="bar-label">XP</span><div class="bar"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div><span id="xp-text">0</span></div>
    </div>
  </div>
  
  <div id="location">الفصل 1: هضبة الجيزة</div>
  <div id="score-display">النقاط: 0<br>المستوى: 1</div>

  <div id="startScreen" class="overlay">
    <h1>HAAK</h1>
    <h2>ظل الفرعون</h2>
    <p>بعد «زحف الظلام»، انطفأت شبكة «أنخ» التي كانت تُشغّل آلات الفراعنة</p>
    <p>أنت «حور»، صياد شاب يرث خطاف جدّه النحاسي</p>
    <p>ابحث عن شظايا «قلب رع» وأعد الفيضان إلى النيل</p>
    <button class="btn" id="startBtn">ابدأ الرحلة</button>
  </div>

  <div id="gameOverScreen" class="overlay" style="display:none">
    <h1 id="endTitle">انتهت اللعبة</h1>
    <p id="endScore">النتيجة: 0</p>
    <button class="btn" id="restartBtn">إعادة</button>
  </div>

  <div id="mobileControls">
    <div class="ctrl-group">
      <div class="ctrl-btn" id="leftBtn">◀</div>
      <div class="ctrl-btn" id="rightBtn">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-btn" id="dashBtn">⚡</div>
      <div class="ctrl-btn" id="jumpBtn">▲</div>
      <div class="ctrl-btn" id="attackBtn">⚔</div>
      <div class="ctrl-btn" id="specialBtn">✦</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 900;
if (isMobile) {
  document.getElementById('mobileControls').style.display = 'flex';
  const scale = Math.min(window.innerWidth / 960, window.innerHeight / 540);
  canvas.style.width = (960 * scale) + 'px';
  canvas.style.height = (540 * scale) + 'px';
}

let gameState = 'start', currentLevel = 0, score = 0;
let cameraX = 0, cameraY = 0;
let particles = [], rainDrops = [], screenShake = 0, gameTime = 0;

const levels = [
  {
    name: 'الفصل 1', subtitle: 'هضبة الجيزة',
    bg: ['#0a0520', '#1a1040', '#2a1a5a'],
    width: 4000,
    platforms: [
      {x:0,y:500,w:1200,h:100},{x:1300,y:500,w:800,h:100},{x:2200,y:500,w:1800,h:100},
      {x:250,y:420,w:120,h:20},{x:500,y:360,w:100,h:20},{x:700,y:300,w:120,h:20},
      {x:900,y:360,w:100,h:20},{x:1100,y:420,w:120,h:20},{x:1350,y:380,w:150,h:20},
      {x:1600,y:320,w:100,h:20},{x:1800,y:380,w:120,h:20},{x:2000,y:440,w:100,h:20},
      {x:2250,y:400,w:150,h:20},{x:2500,y:340,w:120,h:20},{x:2700,y:280,w:100,h:20},
      {x:2900,y:340,w:150,h:20},{x:3100,y:400,w:120,h:20},{x:3300,y:460,w:200,h:20}
    ],
    enemies: [
      {x:500,y:430,type:'mummy',hp:50},{x:900,y:430,type:'mummy',hp:50},
      {x:1400,y:430,type:'scarab',hp:30},{x:1700,y:430,type:'mummy',hp:60},
      {x:2000,y:430,type:'cobra',hp:40},{x:2400,y:430,type:'mummy',hp:60},
      {x:2800,y:430,type:'scarab',hp:30},{x:3100,y:430,type:'mummy',hp:70}
    ],
    boss: {x:3500,y:380,type:'stone_guardian',hp:300}
  },
  {
    name: 'الفصل 2', subtitle: 'سقارة وممفيس',
    bg: ['#1a0520', '#2a0a3a', '#3a1a4a'],
    width: 4500,
    platforms: [
      {x:0,y:500,w:900,h:100},{x:1000,y:500,w:700,h:100},{x:1800,y:500,w:2700,h:100},
      {x:200,y:420,w:100,h:20},{x:400,y:350,w:120,h:20},{x:650,y:280,w:100,h:20},
      {x:850,y:350,w:120,h:20},{x:1100,y:420,w:130,h:20},{x:1350,y:360,w:100,h:20},
      {x:1550,y:300,w:120,h:20},{x:1800,y:360,w:100,h:20},{x:2000,y:430,w:150,h:20},
      {x:2250,y:370,w:120,h:20},{x:2500,y:310,w:100,h:20},{x:2700,y:370,w:150,h:20},
      {x:2950,y:430,w:120,h:20},{x:3200,y:370,w:130,h:20},{x:3450,y:310,w:100,h:20},
      {x:3650,y:370,w:150,h:20},{x:3900,y:430,w:200,h:20}
    ],
    enemies: [
      {x:400,y:430,type:'mummy',hp:70},{x:700,y:430,type:'cobra',hp:50},
      {x:1100,y:430,type:'mummy',hp:70},{x:1400,y:430,type:'scarab_swarm',hp:60},
      {x:1800,y:430,type:'cobra',hp:50},{x:2200,y:430,type:'mummy',hp:80},
      {x:2600,y:430,type:'scarab_swarm',hp:60},{x:2900,y:430,type:'cobra',hp:50},
      {x:3200,y:430,type:'mummy',hp:80},{x:3500,y:430,type:'scarab_swarm',hp:60}
    ],
    boss: {x:4100,y:380,type:'serket',hp:450}
  },
  {
    name: 'الفصل 3', subtitle: 'الأقصر - الكرنك',
    bg: ['#200505', '#3a0a0a', '#4a1a1a'],
    width: 5000,
    platforms: [
      {x:0,y:500,w:1000,h:100},{x:1100,y:500,w:900,h:100},{x:2100,y:500,w:2900,h:100},
      {x:200,y:420,w:120,h:20},{x:450,y:350,w:100,h:20},{x:650,y:280,w:120,h:20},
      {x:900,y:350,w:100,h:20},{x:1150,y:420,w:130,h:20},{x:1400,y:360,w:120,h:20},
      {x:1650,y:300,w:100,h:20},{x:1850,y:360,w:130,h:20},{x:2050,y:430,w:120,h:20},
      {x:2300,y:370,w:100,h:20},{x:2500,y:310,w:150,h:20},{x:2750,y:370,w:120,h:20},
      {x:2950,y:430,w:100,h:20},{x:3200,y:370,w:130,h:20},{x:3450,y:310,w:100,h:20},
      {x:3650,y:370,w:150,h:20},{x:3900,y:430,w:120,h:20},{x:4150,y:370,w:200,h:20},
      {x:4450,y:310,w:250,h:20}
    ],
    enemies: [
      {x:500,y:430,type:'mummy',hp:90},{x:800,y:430,type:'cobra',hp:70},
      {x:1200,y:430,type:'scarab_swarm',hp:70},{x:1500,y:430,type:'mummy',hp:90},
      {x:1800,y:430,type:'cobra',hp:70},{x:2200,y:430,type:'mummy',hp:100},
      {x:2500,y:430,type:'scarab_swarm',hp:70},{x:2800,y:430,type:'cobra',hp:70},
      {x:3200,y:430,type:'mummy',hp:100},{x:3500,y:430,type:'cobra',hp:70},
      {x:3800,y:430,type:'mummy',hp:110},{x:4100,y:430,type:'scarab_swarm',hp:70}
    ],
    boss: {x:4600,y:380,type:'ahmose',hp:600}
  }
];

const player = {
  x:100,y:400,w:40,h:70,vx:0,vy:0,speed:5,maxSpeed:7,jumpPower:14,
  onGround:false,facing:1,hp:100,maxHp:100,energy:100,maxEnergy:100,
  xp:0,xpToNext:100,level:1,damage:18,
  attacking:false,attackTimer:0,attackCooldown:0,
  specialAttack:false,specialTimer:0,
  dashing:false,dashTimer:0,dashCooldown:0,
  invincible:0,jumps:0,maxJumps:2,
  combo:0,comboTimer:0,trail:[]
};

let enemies=[],platforms=[],boss=null,projectiles=[];
const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.code]=false});
const mobileKeys={left:false,right:false,jump:false,attack:false,special:false,dash:false};
let jumpPressed=false,attackPressed=false,specialPressed=false,dashPressed=false;

function setupMobileBtn(id,key){
  const btn=document.getElementById(id);
  const s=e=>{e.preventDefault();mobileKeys[key]=true;btn.classList.add('active')};
  const e2=e=>{e.preventDefault();mobileKeys[key]=false;btn.classList.remove('active')};
  btn.addEventListener('touchstart',s,{passive:false});
  btn.addEventListener('touchend',e2);
  btn.addEventListener('touchcancel',e2);
  btn.addEventListener('mousedown',s);
  btn.addEventListener('mouseup',e2);
  btn.addEventListener('mouseleave',e2);
}
setupMobileBtn('leftBtn','left');setupMobileBtn('rightBtn','right');
setupMobileBtn('jumpBtn','jump');setupMobileBtn('attackBtn','attack');
setupMobileBtn('specialBtn','special');setupMobileBtn('dashBtn','dash');

for(let i=0;i<120;i++)rainDrops.push({x:Math.random()*W,y:Math.random()*H,speed:10+Math.random()*8,len:15+Math.random()*20});

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('startScreen').style.display='none';
  currentLevel=0;player.hp=100;player.energy=100;score=0;
  loadLevel(0);gameState='playing';
};
document.getElementById('restartBtn').onclick=()=>{
  document.getElementById('gameOverScreen').style.display='none';
  currentLevel=0;player.hp=100;player.energy=100;score=0;
  loadLevel(0);gameState='playing';
};

function loadLevel(idx){
  const lv=levels[idx];
  platforms=lv.platforms.map(p=>({...p}));
  enemies=lv.enemies.map(e=>({x:e.x,y:e.y,w:45,h:65,hp:e.hp,maxHp:e.hp,type:e.type,vx:0,vy:0,facing:-1,hit:0,onGround:false}));
  boss={x:lv.boss.x,y:lv.boss.y,w:100,h:130,hp:lv.boss.hp,maxHp:lv.boss.hp,type:lv.boss.type,vx:0,vy:0,facing:-1,hit:0,attackTimer:80,onGround:false,enraged:false};
  player.x=100;player.y=400;player.vx=0;player.vy=0;
  cameraX=0;cameraY=0;projectiles=[];particles=[];
  document.getElementById('location').textContent=lv.name+': '+lv.subtitle;
}

function drawBackground(){
  const lv=levels[currentLevel];
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,lv.bg[0]);grad.addColorStop(0.5,lv.bg[1]);grad.addColorStop(1,lv.bg[2]);
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // Stars with twinkle
  for(let i=0;i<100;i++){
    const sx=(i*137+50)%W,sy=(i*89+20)%(H/2);
    const twinkle=0.4+Math.sin(gameTime/400+i)*0.4;
    ctx.fillStyle=`rgba(255,255,255,${twinkle})`;
    ctx.fillRect(sx,sy,2,2);
  }

  // Parallax pyramids
  const px=-cameraX*0.15;
  ctx.fillStyle='rgba(10,15,40,0.8)';
  if(currentLevel===0){
    drawPyramid(px+100,200,250,320);
    drawPyramid(px+500,180,300,350);
    drawPyramid(px+900,220,200,280);
    drawSphinx(px+1300,250);
  }else if(currentLevel===1){
    drawSteppedPyramid(px+200,180,280,340);
    drawObelisk(px+700,150);
    drawTempleColumns(px+1000,200,8);
  }else{
    drawKarnakColumns(px+100,150,12);
    drawObelisk(px+900,180);
    drawKarnakColumns(px+1200,150,10);
  }

  // Midground pillars with glow
  for(let i=0;i<15;i++){
    const sx=i*280-cameraX*0.5;
    if(sx>-100&&sx<W+100)drawPillar(sx,120,60,400,0.5);
  }

  // Foreground pillars
  for(let i=0;i<12;i++){
    const sx=i*350-cameraX*0.8;
    if(sx>-100&&sx<W+100)drawPillar(sx,80,70,450,0.9);
  }

  // Hieroglyphs with glow
  ctx.font='bold 20px monospace';
  const symbols=['𓂀','𓃭','𓅃','𓆣','𓇳','𓋹','𓌉','𓏏'];
  for(let i=0;i<12;i++){
    const sx=i*350-cameraX*0.8;
    if(sx>-50&&sx<W+50){
      ctx.fillStyle='#00ffff';
      ctx.shadowBlur=15;ctx.shadowColor='#00ffff';
      ctx.globalAlpha=0.6+Math.sin(gameTime/600+i)*0.3;
      ctx.fillText(symbols[i%symbols.length],sx+20,280+(i*35)%150);
    }
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // Rain
  ctx.strokeStyle='rgba(150,220,255,0.4)';ctx.lineWidth=1.5;
  rainDrops.forEach(r=>{
    ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-2,r.y+r.len);ctx.stroke();
    r.y+=r.speed;if(r.y>H){r.y=-r.len;r.x=Math.random()*W}
  });

  // Fog layers
  for(let l=0;l<4;l++){
    ctx.fillStyle=`rgba(0,${100+l*30},${150+l*30},${0.1-l*0.02})`;
    for(let i=0;i<6;i++){
      const fx=((gameTime/25+i*180+l*120)%(W+500))-250;
      ctx.beginPath();ctx.ellipse(fx,460+l*25,250+l*40,60+l*15,0,0,Math.PI*2);ctx.fill();
    }
  }
}

function drawPyramid(x,y,w,h){
  const grad=ctx.createLinearGradient(x,y,x,y+h);
  grad.addColorStop(0,'#1a2a4a');grad.addColorStop(1,'#0a1530');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
  
  // Neon edges with glow
  ctx.strokeStyle='#ff6600';ctx.lineWidth=3;
  ctx.shadowBlur=20;ctx.shadowColor='#ff6600';
  ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w,y+h);ctx.stroke();
  
  // Circuit patterns
  ctx.strokeStyle='#00ffff';ctx.lineWidth=2;
  ctx.shadowBlur=15;ctx.shadowColor='#00ffff';
  for(let i=1;i<6;i++){
    const ly=y+(h/6)*i,lw=(w/2)*(1-i/6);
    ctx.beginPath();ctx.moveTo(x+w/2-lw,ly);ctx.lineTo(x+w/2+lw,ly);ctx.stroke();
  }
  ctx.shadowBlur=0;
}

function drawSteppedPyramid(x,y,w,h){
  const steps=6;
  for(let i=0;i<steps;i++){
    const sy=y+(h/steps)*i,sw=w*(1-i/steps),sx=x+(w-sw)/2;
    const grad=ctx.createLinearGradient(sx,sy,sx,sy+h/steps);
    grad.addColorStop(0,'#2a3a5a');grad.addColorStop(1,'#1a2a4a');
    ctx.fillStyle=grad;
    ctx.fillRect(sx,sy,sw,h/steps);
    ctx.strokeStyle='#00ffff';ctx.lineWidth=2;
    ctx.shadowBlur=10;ctx.shadowColor='#00ffff';
    ctx.strokeRect(sx,sy,sw,h/steps);
  }
  ctx.shadowBlur=0;
}

function drawSphinx(x,y){
  ctx.fillStyle='#0a1530';
  ctx.fillRect(x,y+70,180,90);
  ctx.beginPath();ctx.arc(x+60,y+50,50,0,Math.PI*2);ctx.fill();
  ctx.fillRect(x+10,y+10,100,40);
  
  // Glowing eyes
  ctx.fillStyle='#ff0040';
  ctx.shadowBlur=30;ctx.shadowColor='#ff0040';
  ctx.fillRect(x+35,y+45,15,15);
  ctx.fillRect(x+70,y+45,15,15);
  
  // Circuit lines
  ctx.strokeStyle='#00ffff';ctx.lineWidth=3;
  ctx.shadowBlur=15;ctx.shadowColor='#00ffff';
  ctx.beginPath();
  ctx.moveTo(x+20,y+80);ctx.lineTo(x+160,y+80);

function drawPlayer(){
  const px=player.x-cameraX,py=player.y-cameraY;
  if(player.invincible>0&&Math.floor(player.invincible/4)%2===0)return;

  ctx.save();
  ctx.translate(px+player.w/2,py+player.h/2);
  if(player.facing===-1)ctx.scale(-1,1);
  ctx.translate(-player.w/2,-player.h/2);

  // Trail effect
  if(player.dashing){
    ctx.globalAlpha=0.4;
    ctx.fillStyle='#aa00ff';
    ctx.shadowBlur=30;ctx.shadowColor='#aa00ff';
    ctx.fillRect(-20,-10,player.w+40,player.h+20);

  // Cape with flowing animation
  ctx.fillStyle='#0a1a4a';

  ctx.fillRect(14,56,9,14);ctx.fillRect(24,56,9,14);
  ctx.fillStyle='#1a2a5a';
  ctx.fillRect(12,66,11,7);ctx.fillRect(24,66,11,7);
  ctx.fillStyle='#00ffff';
  ctx.shadowBlur=8;ctx.shadowColor='#00ffff';
  ctx.fillRect(12,71,11,2);ctx.fillRect(24,71,11,2);

  if(player.attacking){
    const swingAngle=(player.attackTimer/20)*Math.PI;

function drawPlatforms(){
  platforms.forEach(p=>{
    const px=p.x-cameraX,py=p.y-cameraY;
    if(px>-p.w&&px<W&&py>-p.h&&py<H){
      const grad=ctx.createLinearGradient(0,py,0,py+p.h);
      grad.addColorStop(0,'#3a4a5a');grad.addColorStop(0.3,'#2a3a4a');grad.addColorStop(1,'#1a2a3a');
      ctx.fillStyle=grad;
      ctx.fillRect(px,py,p.w,p.h);
      
      ctx.strokeStyle='#00ffff';ctx.lineWidth=3;
      ctx.shadowBlur=15;ctx.shadowColor='#00ffff';
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+p.w,py);ctx.stroke();
      ctx.shadowBlur=0;
      
      ctx.strokeStyle='#0a1520';ctx.lineWidth=1;ctx.globalAlpha=0.6;
      for(let i=0;i<p.w;i+=35){ctx.beginPath();ctx.moveTo(px+i,py);ctx.lineTo(px+i,py+p.h);ctx.stroke()}
      for(let j=0;j<p.h;j+=25){ctx.beginPath();ctx.moveTo(px,py+j);ctx.lineTo(px+p.w,py+j);ctx.stroke()}
      ctx.globalAlpha=1;
      
      if(p.w>120&&p.h>60){
        ctx.fillStyle='#00ffff';ctx.globalAlpha=0.4;ctx.font='14px monospace';
        ctx.shadowBlur=10;ctx.shadowColor='#00ffff';
        ctx.fillText('𓂀',px+12,py+35);ctx.fillText('𓃭',px+45,py+35);
        ctx.globalAlpha=1;ctx.shadowBlur=0;
      }
    }
  });
}

function drawProjectiles(){
  projectiles.forEach(p=>{
    const px=p.x-cameraX,py=p.y-cameraY;
    ctx.fillStyle=p.color;
    ctx.shadowBlur=25;ctx.shadowColor=p.color;
    ctx.beginPath();ctx.arc(px,py,p.size,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(px,py,p.size*0.4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle=p.color;ctx.lineWidth=p.size*0.6;ctx.globalAlpha=0.6;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-p.vx*4,py-p.vy*4);ctx.stroke();
    ctx.globalAlpha=1;
  });
}

function drawParticles(){
  particles.forEach(p=>{
    const px=p.x-cameraX,py=p.y-cameraY;
    ctx.fillStyle=p.color;
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.shadowBlur=10;ctx.shadowColor=p.color;
    ctx.fillRect(px-p.size/2,py-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function update(){
  if(gameState!=='playing')return;
  gameTime++;

  const leftKey=keys['ArrowLeft']||keys['KeyA']||mobileKeys.left;
  const rightKey=keys['ArrowRight']||keys['KeyD']||mobileKeys.right;
  const jumpKey=keys['Space']||keys['ArrowUp']||keys['KeyW']||mobileKeys.jump;
  const attackKey=keys['KeyZ']||mobileKeys.attack;
  const specialKey=keys['KeyX']||mobileKeys.special;
  const dashKey=keys['KeyC']||mobileKeys.dash;

  if(jumpKey&&!jumpPressed){
    if(player.onGround){player.vy=-player.jumpPower;player.onGround=false;player.jumps=1;
      for(let i=0;i<6;i++)particles.push({x:player.x+player.w/2,y:player.y+player.h,vx:(Math.random()-0.5)*5,vy:Math.random()*3,life:18,maxLife:18,size:4,color:'#aaaaaa'})
    }else if(player.jumps<player.maxJumps){player.vy=-player.jumpPower*0.9;player.jumps++;
      for(let i=0;i<12;i++)particles.push({x:player.x+player.w/2,y:player.y+player.h/2,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,life:22,maxLife:22,size:4,color:'#00ffff'})
    }
  }
  jumpPressed=jumpKey;

  if(attackKey&&!attackPressed&&player.attackCooldown===0&&player.energy>=10){
    player.attacking=true;player.attackTimer=20;player.attackCooldown=15;player.energy-=10;
    player.combo=(player.combo+1)%4;player.comboTimer=70;
  }
  attackPressed=attackKey;

  if(specialKey&&!specialPressed&&player.energy>=35&&player.specialTimer===0){
    player.specialAttack=true;player.specialTimer=45;player.energy-=35;screenShake=15;
    for(let i=0;i<30;i++)particles.push({x:player.x+player.w/2,y:player.y+player.h/2,vx:(Math.random()-0.5)*14,vy:(Math.random()-0.5)*14,life:40,maxLife:40,size:6,color:'#00ff88'})
  }
  specialPressed=specialKey;

  if(dashKey&&!dashPressed&&player.dashCooldown===0&&player.energy>=25){
    player.dashing=true;player.dashTimer=15;player.dashCooldown=60;player.energy-=25;player.invincible=15;
    for(let i=0;i<15;i++)particles.push({x:player.x+player.w/2,y:player.y+player.h/2,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:30,maxLife:30,size:5,color:'#aa00ff'})
  }
  dashPressed=dashKey;

  if(player.dashing||player.airDashing){}
  else if(leftKey){player.vx=Math.max(player.vx-0.9,-player.maxSpeed);player.facing=-1}
  else if(rightKey){player.vx=Math.min(player.vx+0.9,player.maxSpeed);player.facing=1}
  else{player.vx*=0.87;if(Math.abs(player.vx)<0.1)player.vx=0}

  if(!player.dashing&&!player.airDashing){player.vy+=0.7;if(player.vy>16)player.vy=16}
  player.x+=player.vx;player.y+=player.vy;

  player.onGround=false;
  platforms.forEach(p=>{
    if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>p.y+5&&player.y<p.y+p.h-5){
      if(player.vx>0&&player.x+player.w-player.vx<=p.x+3){player.x=p.x-player.w;player.vx=0}
      else if(player.vx<0&&player.x-player.vx>=p.x+p.w-3){player.x=p.x+p.w;player.vx=0}
    }
    if(player.x+player.w>p.x+3&&player.x<p.x+p.w-3&&player.y+player.h>p.y&&player.y+player.h<p.y+p.h+18&&player.vy>=0){
      player.y=p.y-player.h;player.vy=0;player.onGround=true;player.jumps=0;
    }
    if(player.x+player.w>p.x+3&&player.x<p.x+p.w-3&&player.y<p.y+p.h&&player.y>p.y&&player.vy<0){player.y=p.y+p.h;player.vy=0}
  });

  if(player.x<0)player.x=0;
  if(player.x>levels[currentLevel].width-player.w)player.x=levels[currentLevel].width-player.w;
  if(player.y>H+120){player.x=100;player.y=400;player.vy=0;player.hp-=25;screenShake=12}

  cameraTargetX=player.x-W/3;cameraTargetY=player.y-H/2;
  if(cameraTargetY>120)cameraTargetY=120;if(cameraTargetY<-120)cameraTargetY=-120;
  cameraX+=(cameraTargetX-cameraX)*0.12;cameraY+=(cameraTargetY-cameraY)*0.12;
  if(cameraX<0)cameraX=0;if(cameraX>levels[currentLevel].width-W)cameraX=levels[currentLevel].width-W;

  if(player.attackTimer>0){player.attackTimer--;if(player.attackTimer===0)player.attacking=false}
  if(player.attackCooldown>0)player.attackCooldown--;
  if(player.specialTimer>0){player.specialTimer--;if(player.specialTimer===0)player.specialAttack=false}
  if(player.invincible>0)player.invincible--;
  if(player.dashTimer>0){player.dashTimer--;player.vx=player.facing*16;player.vy=0;
    if(gameTime%2===0)player.trail.push({x:player.x,y:player.y,life:12});
    if(player.dashTimer===0)player.dashing=false}
  if(player.dashCooldown>0)player.dashCooldown--;
  if(player.comboTimer>0){player.comboTimer--;if(player.comboTimer===0)player.combo=0}

  player.trail=player.trail.filter(t=>{t.life--;return t.life>0});
  if(player.energy<player.maxEnergy)player.energy+=0.15;

  enemies.forEach(e=>{
    if(e.hp<=0)return;if(e.hit>0)e.hit--;
    const dx=player.x-e.x,dy=player.y-e.y,dist=Math.sqrt(dx*dx+dy*dy);
    
    if(e.type==='mummy'){if(dist<450){e.vx=Math.sign(dx)*2;e.facing=Math.sign(dx)}else e.vx*=0.9}
    else if(e.type==='scarab'){if(dist<400){e.vx=Math.sign(dx)*3;e.facing=Math.sign(dx);e.y+=Math.sin(gameTime/90+e.x)*0.6}else e.vx*=0.9}
    else if(e.type==='scarab_swarm'){if(dist<450){e.vx=Math.sign(dx)*2.5;e.facing=Math.sign(dx);e.y+=Math.sin(gameTime/70+e.x)*0.9}else e.vx*=0.9}
    else if(e.type==='cobra'){
      if(dist<350){e.vx=Math.sign(dx)*2.5;e.facing=Math.sign(dx);
        if(dist<120&&Math.random()<0.025){projectiles.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:Math.sign(dx)*9,vy:-1.5,size:10,color:'#00ff88',life:70,fromEnemy:true})}
      }else e.vx*=0.9}

    e.vy=(e.vy||0)+0.7;e.x+=e.vx;e.y+=e.vy;
    e.onGround=false;
    platforms.forEach(p=>{if(e.x+e.w>p.x&&e.x<p.x+p.w&&e.y+e.h>p.y&&e.y+e.h<p.y+p.h+18&&e.vy>=0){e.y=p.y-e.h;e.vy=0;e.onGround=true}});

    if(player.invincible===0&&!player.dashing&&player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y){
      player.hp-=12;player.invincible=70;player.vy=-10;player.vx=-Math.sign(dx)*10;screenShake=6;
    }

    const attackRange=player.specialAttack?110:80;
    const attackDmg=player.specialAttack?player.damage*2.5:(player.damage+player.combo*3);
    if((player.attacking||player.specialAttack)&&Math.abs((player.x+player.w/2)-(e.x+e.w/2))<attackRange&&Math.abs((player.y+player.h/2)-(e.y+e.h/2))<90){
      if(e.hit===0){e.hp-=attackDmg;e.hit=14;e.vx=Math.sign(e.x-player.x)*12;e.vy=-7;score+=12;screenShake=5;
        for(let i=0;i<12;i++)particles.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12,life:28,maxLife:28,size:4+Math.random()*3,color:player.specialAttack?'#00ff88':'#ffaa00'});
        if(e.hp<=0){score+=e.type==='scarab_swarm'?90:120;player.xp+=18;
          if(Math.random()<0.4){player.hp=Math.min(player.maxHp,player.hp+35);player.energy=Math.min(player.maxEnergy,player.energy+45)}
          for(let i=0;i<28;i++)particles.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-0.5)*16,vy:(Math.random()-0.5)*16,life:50,maxLife:50,size:5+Math.random()*5,color:'#ff0040'})
        }
      }
    }
  });

  if(boss&&boss.hp>0){
    if(boss.hit>0)boss.hit--;boss.attackTimer--;
    const dx=player.x-boss.x,dy=player.y-boss.y,dist=Math.sqrt(dx*dx+dy*dy);
    
    if(boss.hp<boss.maxHp*0.3&&!boss.enraged){boss.enraged=true;screenShake=25;
      for(let i=0;i<35;i++)particles.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:(Math.random()-0.5)*18,vy:(Math.random()-0.5)*18,life:60,maxLife:60,size:7,color:'#ff0040'})}

    const speedMult=boss.enraged?1.6:1,attackMult=boss.enraged?0.65:1;
    if(dist<800){boss.vx=Math.sign(dx)*3*speedMult;boss.facing=Math.sign(dx);
      if(boss.attackTimer<=0){boss.attackTimer=(55+Math.random()*45)*attackMult;
        if(boss.type==='stone_guardian'){projectiles.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:Math.sign(dx)*8,vy:-2.5,size:16,color:'#ff0040',life:110,fromEnemy:true});
          if(boss.enraged)projectiles.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:Math.sign(dx)*6,vy:-6,size:12,color:'#ff6600',life:110,fromEnemy:true})}
        else if(boss.type==='serket'){for(let i=-1;i<=1;i++)projectiles.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:Math.sign(dx)*7,vy:i*2.5,size:14,color:'#00ffff',life:110,fromEnemy:true});
          if(boss.enraged&&boss.onGround)boss.vy=-18}
        else if(boss.type==='ahmose'){for(let i=-2;i<=2;i++)projectiles.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:Math.sign(dx)*7,vy:i*1.8,size:16,color:'#ffaa00',life:130,fromEnemy:true});
          if(boss.enraged&&Math.random()<0.35)for(let i=0;i<6;i++)setTimeout(()=>{if(boss.hp>0)projectiles.push({x:player.x+(Math.random()-0.5)*250,y:cameraY-60,vx:0,vy:9,size:14,color:'#ff0040',life:110,fromEnemy:true})},i*180)}
      }
      if(dist<180&&boss.onGround&&Math.random()<0.018*speedMult)boss.vy=-18;
    }else boss.vx*=0.9;

    boss.vy=(boss.vy||0)+0.7;boss.x+=boss.vx;boss.y+=boss.vy;
    boss.onGround=false;
    platforms.forEach(p=>{if(boss.x+boss.w>p.x&&boss.x<p.x+p.w&&boss.y+boss.h>p.y&&boss.y+boss.h<p.y+p.h+18&&boss.vy>=0){boss.y=p.y-boss.h;boss.vy=0;boss.onGround=true}});

    if(player.invincible===0&&!player.dashing&&player.x<boss.x+boss.w&&player.x+player.w>boss.x&&player.y<boss.y+boss.h&&player.y+player.h>boss.y){
      player.hp-=22;player.invincible=100;player.vy=-14;player.vx=-Math.sign(dx)*18;screenShake=18;
    }

    const attackRange=player.specialAttack?120:90;
    const attackDmg=player.specialAttack?player.damage*3:(player.damage+player.combo*3);
    if((player.attacking||player.specialAttack)&&Math.abs((player.x+player.w/2)-(boss.x+boss.w/2))<attackRange&&Math.abs((player.y+player.h/2)-(boss.y+boss.h/2))<120){
      if(boss.hit===0){boss.hp-=attackDmg;boss.hit=18;boss.vx=Math.sign(boss.x-player.x)*14;boss.vy=-10;score+=28;screenShake=10;
        for(let i=0;i<18;i++)particles.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:(Math.random()-0.5)*16,vy:(Math.random()-0.5)*16,life:40,maxLife:40,size:6+Math.random()*5,color:player.specialAttack?'#00ff88':'#ffaa00'});
        if(boss.hp<=0){score+=boss.type==='ahmose'?3500:(boss.type==='serket'?2000:1000);player.xp+=120;
          for(let i=0;i<70;i++)particles.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,vx:(Math.random()-0.5)*22,vy:(Math.random()-0.5)*22,life:80,maxLife:80,size:7+Math.random()*9,color:['#ff0040','#ffaa00','#00ffff','#00ff88'][Math.floor(Math.random()*4)]});
          setTimeout(()=>{currentLevel++;if(currentLevel>=levels.length){gameState='victory';document.getElementById('endTitle').textContent='🏆 انتصرت! 🏆';document.getElementById('endScore').textContent='النتيجة النهائية: '+score+' | المستوى: '+player.level;document.getElementById('gameOverScreen').style.display='flex'}else{loadLevel(currentLevel);gameState='playing'}},3000)
        }
      }
    }
  }

  projectiles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.fromEnemy)p.vy+=0.12;p.life--;
    if(p.fromEnemy&&player.invincible===0&&!player.dashing&&Math.abs(p.x-(player.x+player.w/2))<22&&Math.abs(p.y-(player.y+player.h/2))<35){player.hp-=14;player.invincible=70;p.life=0;screenShake=10}
  });
  projectiles=projectiles.filter(p=>p.life>0);

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;p.vx*=0.97;p.life--});
  particles=particles.filter(p=>p.life>0);

  if(screenShake>0)screenShake*=0.9;if(screenShake<0.3)screenShake=0;

  document.getElementById('hp-fill').style.width=Math.max(0,player.hp/player.maxHp*100)+'%';
  document.getElementById('en-fill').style.width=Math.max(0,player.energy/player.maxEnergy*100)+'%';
  document.getElementById('xp-fill').style.width=(player.xp/player.xpToNext*100)+'%';
  document.getElementById('hp-text').textContent=Math.floor(player.hp);
  document.getElementById('en-text').textContent=Math.floor(player.energy);
  document.getElementById('xp-text').textContent=player.xp+'/'+player.xpToNext;
  document.getElementById('score-display').innerHTML='النقاط: '+score+'<br>المستوى: '+player.level;

  if(player.hp<=0){gameState='gameOver';document.getElementById('endTitle').textContent='انتهت اللعبة';document.getElementById('endScore').textContent='النتيجة: '+score+' | المستوى: '+player.level;document.getElementById('gameOverScreen').style.display='flex'}
}

function render(){
  ctx.save();
  if(screenShake>0){ctx.translate((Math.random()-0.5)*screenShake*2,(Math.random()-0.5)*screenShake*2)}
  drawBackground();drawPlatforms();
  enemies.forEach(e=>{if(e.hp>0)drawEnemy(e)});
  if(boss&&boss.hp>0)drawBoss(boss);
  drawProjectiles();
  player.trail.forEach(t=>{ctx.globalAlpha=t.life/12*0.35;ctx.fillStyle='#aa00ff';ctx.shadowBlur=20;ctx.shadowColor='#aa00ff';ctx.fillRect(t.x-cameraX,t.y-cameraY,player.w,player.h)});
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  drawPlayer();drawParticles();
  ctx.restore();

  if(boss&&boss.hp>0&&boss.hp<boss.maxHp){
    const barW=450,barX=(W-barW)/2;
    ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(barX-8,48,barW+16,35);
    ctx.fillStyle='#330000';ctx.fillRect(barX,55,barW,18);
    const hpRatio=boss.hp/boss.maxHp;
    const hpColor=boss.enraged?'#ff0040':(hpRatio>0.5?'#ff6600':'#ff0040');
    ctx.fillStyle=hpColor;ctx.fillRect(barX,55,barW*hpRatio,18);
    ctx.strokeStyle=hpColor;ctx.lineWidth=3;ctx.strokeRect(barX,55,barW,18);
    ctx.fillStyle='#ffffff';ctx.font='bold 15px monospace';ctx.textAlign='center';
    ctx.shadowBlur=10;ctx.shadowColor='#ffffff';
    const bossName=boss.type==='stone_guardian'?'حارس الحجر':boss.type==='serket'?'سركت، سيدة العقارب':'أحمس، يد ستّ';
    ctx.fillText(bossName+(boss.enraged?' [غاضب]':''),W/2,48);
    ctx.textAlign='left';ctx.shadowBlur=0;
  }

  if(player.combo>1){ctx.fillStyle='#ffaa00';ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.shadowBlur=18;ctx.shadowColor='#ffaa00';ctx.fillText('كومبو x'+player.combo,W/2,110);ctx.textAlign='left';ctx.shadowBlur=0}
}

let cameraTargetX=0,cameraTargetY=0;
function gameLoop(){update();if(gameState==='playing')render();requestAnimationFrame(gameLoop)}
gameLoop();
</script>
</body>
  </html>
